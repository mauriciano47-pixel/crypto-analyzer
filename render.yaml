services:
  - type: web
    name: crypto-analyzer-backend
    runtime: python
    rootDir: crypto-pattern-analyzer
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 4
      - key: ALLOWED_HOSTS
        value: "crypto-analyzer-backend.onrender.com,cryptopat-api.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://crypto-frontend-weld.vercel.app,https://cryptopat.vercel.app,https://cpat.vercel.app,https://canalyzer.vercel.app,http://localhost:3005,http://127.0.0.1:3005"
