<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Fondo Gradiente Cyber-Obsidian con acento Esmeralda -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Verde Esmeralda Alcista Neón -->
    <linearGradient id="bullGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Azul Eléctrico Cuántico -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Cian Impulso -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Resplandor Neón Superior -->
    <filter id="glowFavicon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base OLED Profundo con Borde Esmeralda Cuántico -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10B981" stroke-width="2.5"/>

  <!-- Líneas sutiles de soporte / resistencia de fondo -->
  <line x1="8" y1="23" x2="56" y2="23" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="8" y1="41" x2="56" y2="41" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- VELA 1 (Izquierda - Azul Eléctrico): Mecha y Cuerpo -->
  <line x1="17" y1="24" x2="17" y2="50" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <rect x="12.5" y="30" width="9" height="13" rx="2.5" fill="url(#blueGrad)" stroke="#60A5FA" stroke-width="1"/>

  <!-- VELA 2 (Centro - Cian Neón): Mecha y Cuerpo -->
  <line x1="32" y1="16" x2="32" y2="46" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
  <rect x="27.5" y="22" width="9" height="16" rx="2.5" fill="url(#cyanGrad)" stroke="#67E8F9" stroke-width="1"/>

  <!-- VELA 3 (Derecha - Verde Esmeralda Alcista Dominante): Mecha y Cuerpo -->
  <line x1="47" y1="9" x2="47" y2="42" stroke="#10B981" stroke-width="3.2" stroke-linecap="round"/>
  <rect x="42" y="14" width="10" height="20" rx="2.5" fill="url(#bullGrad)" stroke="#34D399" stroke-width="1.2"/>

  <!-- Flecha de Tendencia Alcista en la Cima Derecha -->
  <path d="M 43 9 L 51 9 L 51 17" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodo Cuántico Brillante en la Ruptura -->
  <circle cx="51" cy="9" r="3.5" fill="#34D399" filter="url(#glowFavicon)"/>
  <circle cx="51" cy="9" r="1.8" fill="#FFFFFF"/>
</svg>