<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de Fondo Oscuro Cyber-Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Gradiente para la Vela Alcista Dominante -->
    <linearGradient id="candleBull" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Gradiente de la Línea de Tendencia Cuantitativa -->
    <linearGradient id="trendLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Resplandor Neón para el Nodo Algorítmico -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Contenedor Base Estilizado (Squircle OLED con Borde Tecnológico) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Líneas de Cuadrícula Sutiles (Grid de Trading) -->
  <line x1="10" y1="22" x2="54" y2="22" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.4"/>
  <line x1="10" y1="42" x2="54" y2="42" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.4"/>

  <!-- VELA 1 (Izquierda: Base de Soporte Azul Eléctrico) -->
  <!-- Mecha -->
  <line x1="18" y1="28" x2="18" y2="48" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Cuerpo -->
  <rect x="15" y="32" width="6" height="11" rx="1.5" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>

  <!-- VELA 2 (Centro: Consolidación / Impulso Cian) -->
  <!-- Mecha -->
  <line x1="32" y1="20" x2="32" y2="44" stroke="#06B6D4" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Cuerpo -->
  <rect x="29" y="24" width="6" height="14" rx="1.5" fill="#06B6D4" fill-opacity="0.85"/>

  <!-- VELA 3 (Derecha: Ruptura Alcista Dominante Esmeralda) -->
  <!-- Mecha -->
  <line x1="46" y1="12" x2="46" y2="38" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <!-- Cuerpo -->
  <rect x="43" y="16" width="6" height="17" rx="1.5" fill="url(#candleBull)" stroke="#34D399" stroke-width="1"/>

  <!-- Curva de Tendencia Algorítmica y Momentum -->
  <path d="M 14 43 Q 28 38 38 24 T 50 14" fill="none" stroke="url(#trendLine)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nodo Activo con Glow en la Cima -->
  <circle cx="50" cy="14" r="3" fill="#10B981" filter="url(#glow)"/>
  <circle cx="50" cy="14" r="1.5" fill="#FFFFFF"/>
</svg>